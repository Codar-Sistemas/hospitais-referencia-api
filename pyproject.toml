[project]
name = "hospitais-referencia-api-scripts"
version = "1.0.0"
description = "ETL pipeline for Brazilian reference hospitals API"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "node_modules", ".next", ".vercel"]

[tool.ruff.lint]
# Enabled rule groups — pragmatic baseline, not exhaustive.
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear,
# UP: pyupgrade, SIM: simplify, RUF: ruff-specific.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E501",   # line length — handled by formatter
  "B008",   # function calls in default args — common in FastAPI/Click patterns
  "SIM103", # return-condition-directly — sometimes explicit if/else is clearer
  "SIM105", # contextlib.suppress — try/except/pass is fine in best-effort code
  "SIM108", # ternary preference — sometimes if/else is clearer
  "B905",   # zip without strict= — fine when lengths are known equal
  "RUF007", # itertools.pairwise — zip(a[:-1], a[1:]) reads fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_reexport = true
# Some third-party libs ship without stubs; ignore those rather than
# polluting the tree with `# type: ignore`.
ignore_missing_imports = true
exclude = ['^\.venv/', '^node_modules/', '^web/', '^\.next/']

[[tool.mypy.overrides]]
# Tests rely on real PDFs/XLSX fixtures and bend types intentionally —
# strict mode there fights the test ergonomics more than it helps.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_return_any = false
