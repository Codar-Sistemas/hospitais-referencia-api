name: sync-hospitals

on:
  schedule:
    - cron: '0 3 * * *' # daily 03:00 UTC = 00:00 Brasília
  workflow_dispatch:
    inputs:
      state_code:
        description: 'Specific state code (empty = all)'
        required: false
        default: ''
      force:
        description: 'Force reprocessing'
        required: false
        default: 'false'
      skip_geocoding:
        description: 'Skip the geocoding step'
        required: false
        default: 'false'

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    outputs:
      has_pending: ${{ steps.check.outputs.has_pending }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Native deps for OCR fallback.
      # tesseract-ocr-por: Portuguese dictionary for better recognition.
      # poppler-utils:     required by pdf2image to rasterize PDFs.
      - name: Install OCR system dependencies (tesseract + poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-por poppler-utils

      - run: pip install -r requirements.txt

      - name: Sync PDFs into the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Both LLM keys are optional. If a key is missing, that provider
          # is skipped and the chain falls through to Tesseract.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          ARGS="sync"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ github.event.inputs.state_code }}" ]; then ARGS="$ARGS ${{ github.event.inputs.state_code }}"; fi
          python -m scripts.syncs.venomous_animals $ARGS

      # Other verticals run in their OWN staggered workflows
      # (sync-rare-diseases.yml @ 04:30 UTC, sync-oncology.yml @ 05:30 UTC)
      # so external services (gov.br, CNES API, Nominatim) never get hit by
      # two verticals at once and failures stay isolated per vertical.

      - id: check
        name: Check whether any hospitals are pending geocoding
        if: github.event.inputs.skip_geocoding != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          COUNT=$(curl -sf \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Prefer: count=exact" \
            -I "$SUPABASE_URL/rest/v1/hospitals?geocoding_status=eq.pending&limit=1" \
            | grep -i content-range | awk -F'/' '{print $2}' | tr -d '\r' || echo "0")
          echo "Pending: $COUNT"
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "has_pending=true" >> $GITHUB_OUTPUT
          else
            echo "has_pending=false" >> $GITHUB_OUTPUT
          fi

  geocode:
    needs: sync
    if: needs.sync.outputs.has_pending == 'true' && github.event.inputs.skip_geocoding != 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Geocode pending hospitals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m scripts.syncs.venomous_animals geocode --limit 5000
