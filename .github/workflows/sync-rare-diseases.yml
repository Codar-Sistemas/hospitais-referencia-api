# Rare-diseases vertical sync — runs in its own staggered slot (04:30 UTC,
# after the venomous workflow's 03:00 run) so gov.br, the CNES API and
# Nominatim never serve two verticals at once, and a failure here never
# blocks the other verticals.
name: sync-rare-diseases

on:
  schedule:
    - cron: '30 4 * * *' # daily 04:30 UTC = 01:30 Brasília
  workflow_dispatch:
    inputs:
      force:
        description: 'Force reprocessing (ignore file-hash short-circuit)'
        required: false
        default: 'false'

concurrency:
  group: sync-rare-diseases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    outputs:
      has_pending: ${{ steps.check.outputs.has_pending }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Sync rare diseases (national XLSX)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS="sync"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m scripts.syncs.rare_diseases $ARGS

      - id: check
        name: Check whether rare-diseases hospitals are pending geocoding
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          COUNT=$(curl -sf \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Prefer: count=exact" \
            -I "$SUPABASE_URL/rest/v1/hospitals?geocoding_status=eq.pending&verticals=cs.%7Brare_diseases%7D&limit=1" \
            | grep -i content-range | awk -F'/' '{print $2}' | tr -d '\r' || echo "0")
          echo "Pending: $COUNT"
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "has_pending=true" >> $GITHUB_OUTPUT
          else
            echo "has_pending=false" >> $GITHUB_OUTPUT
          fi

  geocode:
    needs: sync
    if: needs.sync.outputs.has_pending == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Geocode pending rare-diseases hospitals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m scripts.syncs.rare_diseases geocode --limit 1000
