name: tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testar normalização de atendimentos
        run: python -m tests.test_atendimentos

      - name: Testar módulo geocode (funções puras + cache)
        run: python -m tests.test_geocode

      - name: Testar parser XLSX (doenças raras)
        run: python -m tests.test_xlsx_parser

      - name: Testar mapeamento de especialidades (doenças raras)
        run: python -m tests.test_rare_specialties

      - name: Testar upserter multi-vertical (doenças raras)
        run: python -m tests.test_rare_upserter

      - name: Testar parser de planilhas (oncologia)
        run: python -m tests.test_oncology_parser

      - name: Testar mapeamento de códigos 17.XX (oncologia)
        run: python -m tests.test_oncology_specialties

      - name: Testar montagem e upsert do snapshot (oncologia)
        run: python -m tests.test_oncology_sync

      - name: Testar parser da página CIATOX
        run: python -m tests.test_ciatox_parser

      - name: Testar listagem paginada da API CNES
        run: python -m tests.test_cnes_list

      - name: Testar política de confirmação CNES e batch de enriquecimento
        run: python -m tests.test_cnes_confirmation

      - name: Testar coleta da vertical de saúde mental (CAPS)
        run: python -m tests.test_mental_health_sync
