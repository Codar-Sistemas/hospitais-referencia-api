# Retention enforcement — the Terms of Use promise telemetry is deleted after
# 30 days. Each week we first roll the raw rows up into metrics_daily (retained
# aggregates, no PII) so long-term trends survive, THEN purge api_metrics +
# web_events older than 30 days. Both functions are SECURITY DEFINER,
# service_role only. Off-peak slot (Sunday 02:00 UTC) — no overlap with syncs.
name: cleanup-metrics

on:
  schedule:
    - cron: '0 2 * * 0' # weekly, Sunday 02:00 UTC = Saturday 23:00 Brasília
  workflow_dispatch: {}

concurrency:
  group: cleanup-metrics
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Roll up daily aggregates, then purge raw rows older than 30 days
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          rpc() {
            curl -fsS -X POST "${SUPABASE_URL}/rest/v1/rpc/$1" \
              -H "apikey: ${SUPABASE_SERVICE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
              -H "Content-Type: application/json" \
              -d '{}'
          }
          # Capture aggregates FIRST so no day is lost to the purge below.
          echo "Daily rows rolled up: $(rpc rollup_metrics_daily)"
          echo "Raw rows removed (api_metrics + web_events): $(rpc cleanup_old_metrics)"
