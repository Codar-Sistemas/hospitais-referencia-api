# Retention enforcement — the Terms of Use promise telemetry is deleted after
# 30 days. cleanup_old_metrics() (SECURITY DEFINER, service_role only) purges
# api_metrics + web_events older than 30 days; this runs it weekly. Low,
# off-peak slot (Sunday 02:00 UTC) that never overlaps the daily syncs.
name: cleanup-metrics

on:
  schedule:
    - cron: '0 2 * * 0' # weekly, Sunday 02:00 UTC = Saturday 23:00 Brasília
  workflow_dispatch: {}

concurrency:
  group: cleanup-metrics
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Purge metrics older than 30 days
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          removed=$(curl -fsS -X POST \
            "${SUPABASE_URL}/rest/v1/rpc/cleanup_old_metrics" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Rows removed (api_metrics + web_events): ${removed}"
